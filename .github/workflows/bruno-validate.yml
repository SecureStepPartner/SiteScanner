name: Bruno validation

on:
  pull_request:
    paths: ['bruno/**', 'scripts/validate-bruno.sh', '.github/workflows/bruno-validate.yml']
  push:
    paths: ['bruno/**', 'scripts/validate-bruno.sh', '.github/workflows/bruno-validate.yml']

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/validate-bruno.sh
